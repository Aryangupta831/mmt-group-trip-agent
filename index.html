<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakeMyTrip Group Trip Agent · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
/* =====================================================================
   MMT × AGENT OVERLAY — STYLE LIBRARY v3
   Layout: left index, right content. Foundations → orb → controls → notifications → agent cards
           → sheets → decisions → map → states → micro-interactions → screens (MMT + WhatsApp) → rules.
   App colours sampled from current MakeMyTrip and WhatsApp screens in the Figma file.
   ===================================================================== */
:root{
  color-scheme:light;
  /* MMT core */
  --blue:#008CFF; --blue-deep:#0A5BC4; --blue-tint:#CCE8FF; --blue-wash:#EAF4FC; --blue-line:#B9DCFB;
  --cta:linear-gradient(93deg,#53B2FE 0%,#065AF3 100%);
  --myra:linear-gradient(90deg,#2F6FD6 0%,#54B4FC 100%);
  --teal:#2A8C84; --teal-tint:#E8F8F7; --orange:#FFA94D; --toast:#484848; --red-brand:#EC2028; --badge:#F21F1F;
  --bg:#F0F0F0; --surface:#FFFFFF; --surface-2:#F6F7F9; --divider:#E6E6E6;
  --ink:#000000; --ink-2:#4A4A4A; --ink-3:#8C8C8C;
  /* Agent layer (light) */
  --ag-card:linear-gradient(135deg,#F4F9FF 0%,#E9F2FF 55%,#EEF0FF 100%);
  --ag-edge:linear-gradient(135deg,#8CC6FF 0%,#B9C4FF 100%);
  --ag-ink:#0C1B33; --ag-soft:#EEF5FF; --ag-private:#5B4BB7; --ag-private-tint:#F1EEFC;
  /* Agent layer (dark, over WhatsApp) */
  --ag-dark:linear-gradient(160deg,rgba(13,22,40,.96) 0%,rgba(14,33,66,.96) 60%,rgba(20,52,112,.96) 100%);
  --ag-dark-line:rgba(126,182,255,.35);
  /* States */
  --urgent:#E8590C; --urgent-bg:linear-gradient(135deg,#FFF6EE 0%,#FFEDE6 100%);
  --error:#D0021B; --error-bg:linear-gradient(135deg,#FFF3F3 0%,#FDEBED 100%);
  --ok:#1E8A4C; --ok-bg:linear-gradient(135deg,#EDFAF2 0%,#E6F5FF 100%);
  --remind:#2A8C84; --remind-bg:linear-gradient(135deg,#E9F8F7 0%,#EEF6FF 100%);
  /* WhatsApp context (dark) */
  --wa-bg:#0B0B0B; --wa-head:#121212; --wa-in:#1F1F1F; --wa-out:#144D37; --wa-input:#2A2A2A; --wa-green:#21C063; --wa-tick:#53BDEB; --wa-meta:#8D8D8D;
  --wac-bg:#111B21; --wac-tile:#1F2C33; --wac-sheet:#1F2C34; --wac-toast:#3B464B; --wac-end:#EA4E4E;
  --font:"Lato",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --e1:0 1px 3px rgba(0,0,0,.07),0 1px 1px rgba(0,0,0,.03); --e2:0 4px 14px rgba(15,40,90,.10); --e3:0 12px 32px rgba(15,40,90,.16);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E9EBEE;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;flex:none;user-select:none}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 24}
.ms.s16{font-size:16px}.ms.s18{font-size:18px}.ms.s22{font-size:22px}.ms.s24{font-size:24px}

/* ---------- Page chrome ---------- */
.page{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.index{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 16px;border-right:1px solid #DCDFE4;background:#F6F7F9;display:grid;gap:2px;align-content:start}
.index .brand{display:grid;gap:2px;margin-bottom:14px;padding:0 10px}
.index .brand b{font-size:15px;font-weight:900}
.index .brand span{font-size:12px;color:var(--ink-2)}
.index a{color:var(--ink-2);text-decoration:none;font-size:13px;padding:6px 10px;border-radius:8px}
.index a:hover{background:#fff;color:var(--ink)}
.index .grp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:14px 10px 4px}
main{padding:40px 44px 100px;display:grid;gap:72px;max-width:1240px;min-width:0}
.hero{display:grid;gap:12px;max-width:800px}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.hero p{font-size:16px;color:var(--ink-2)}
.disclaim{font-size:12px;color:var(--ink-3)}
.sec{display:grid;gap:22px;min-width:0}
.sec>header{display:grid;gap:6px;max-width:740px}
.sec>header h2{font-size:24px;font-weight:900}
.sec>header p{color:var(--ink-2);font-size:15px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.board{background:#fff;border:1px solid #E1E3E7;border-radius:16px;padding:22px;display:grid;gap:16px;align-content:start;min-width:0}
.board>h3{font-size:15px;font-weight:700}
.note{font-size:12px;color:var(--ink-2)}
.note b{color:var(--ink)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.canvas{background:var(--bg);border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.canvas.col{flex-direction:column;align-items:stretch}
.canvas.dark{background:#0B0B0B}
.label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.copy{border:1px solid var(--divider);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px;color:var(--blue)}

/* Swatches & type */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sw{border:1px solid #E6E8EB;border-radius:12px;overflow:hidden;background:#fff}
.sw i{display:block;height:58px}
.sw div{padding:8px 10px;display:grid;gap:1px}
.sw b{font-size:12.5px}
.sw span{font-size:11.5px;color:var(--ink-2)}
.type-row{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px solid #F0F1F3}
.type-row:last-child{border-bottom:0}
.spec{font-size:12px;color:var(--ink-2)}
.spec b{color:var(--ink)}

/* ---------- Text styles ---------- */
.t-hero{font-size:26px;line-height:32px;font-weight:900;letter-spacing:-.01em}
.t-title{font-size:16px;line-height:21px;font-weight:900}
.t-sub{font-size:14px;line-height:19px;font-weight:700}
.t-body{font-size:13px;line-height:18px;color:var(--ink-2)}
.t-cap{font-size:11.5px;line-height:15px;color:var(--ink-2)}
.t-price{font-size:18px;line-height:22px;font-weight:900}
.t-over{font-size:10.5px;line-height:14px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.grad-text{background:var(--myra);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--cta);box-shadow:0 3px 8px rgba(6,90,243,.28);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease,box-shadow .12s ease,filter .12s}
.btn:active,.btn.pressed{transform:scale(.97);box-shadow:0 1px 3px rgba(6,90,243,.3);filter:brightness(.95)}
.btn:disabled{background:#D4DAE2;box-shadow:none;color:#fff;cursor:default}
.btn.block{width:100%}
.btn.sm{padding:9px 16px;font-size:12px}
.btn .spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn2{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;padding:11px 20px;font-size:13px;font-weight:900;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,background .15s}
.btn2:active{transform:scale(.97);background:var(--blue-wash)}
.btn2.sm{padding:7px 14px;font-size:12px}
.btn3{border:0;background:none;color:var(--blue);font-weight:900;font-size:13px;padding:6px 4px;display:inline-flex;align-items:center;gap:4px}
.btn-dark{border:0;background:#111827;color:#fff;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.btn-dark:active{transform:scale(.97)}
.btn-agent{border:0;border-radius:999px;padding:1.5px;background:var(--ag-edge);display:inline-flex;transition:transform .12s;box-shadow:0 4px 14px rgba(47,111,214,.18)}
.btn-agent>span{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFFFFF,#F1F6FF);border-radius:999px;padding:6px 16px 6px 6px;font-size:13px;font-weight:900;color:var(--ag-ink)}
.btn-agent:active{transform:scale(.97)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--blue-line);background:var(--blue-wash);color:var(--blue);display:grid;place-items:center;transition:transform .12s}
.icon-btn:active{transform:scale(.94)}
.icon-btn.round{border-radius:50%;background:#fff;border-color:#E3E6EA;color:var(--ink)}
.chip{border:1px solid #DADDE2;background:#fff;border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s,transform .12s}
.chip:active{transform:scale(.96)}
.chip.on{border-color:var(--blue);background:var(--blue-wash);color:var(--ink);font-weight:700}
.chip .lead{display:grid;line-height:1.1;text-align:left}
.chip .lead small{font-size:10px;color:var(--ink-2);font-weight:400}
.pill-chip{border:1px solid #DADDE2;background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.pill-chip.on{background:var(--ag-ink);border-color:var(--ag-ink);color:#fff}
.seg{display:inline-grid;grid-auto-flow:column;background:#E9ECF0;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .18s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:var(--e1)}
.toggle{width:46px;height:28px;border-radius:999px;background:#C9CED6;border:0;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.toggle.on{background:var(--blue)}
.toggle.on::after{transform:translateX(18px)}

/* ---------- Tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.tag.ok{background:#E6F5EC;color:var(--ok)} .tag.warn{background:#FFF1E2;color:#C25A00} .tag.blue{background:var(--blue-wash);color:var(--blue)} .tag.err{background:#FDECEE;color:var(--error)} .tag.grey{background:#EFEFEF;color:var(--ink-2)} .tag.priv{background:var(--ag-private-tint);color:var(--ag-private)}
.badge{background:var(--badge);color:#fff;font-size:9.5px;font-weight:900;padding:0 6px;border-radius:999px;line-height:15px}

/* ---------- MMT cards ---------- */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--e1)}
.flight{padding:14px 14px 0;display:grid;gap:10px;overflow:hidden}
.flight .air{display:flex;align-items:center;gap:10px}
.logo-sq{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:10px}
.flight .row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:end}
.flight .tm b{display:block;font-size:19px;font-weight:900}
.flight .tm span{font-size:12px;color:var(--ink-2)}
.flight .dur{text-align:center;font-size:12px;color:var(--ink-2)}
.flight .dur i{display:block;height:1px;background:#C9CDD3;margin:3px 0}
.flight .offer{font-size:12.5px;color:var(--teal);display:flex;align-items:center;gap:4px}
.flight .foot{display:flex;justify-content:flex-end;margin:0 -14px}
.lockp{background:var(--blue-wash);color:var(--blue);font-weight:700;font-size:12.5px;padding:8px 14px 8px 16px;border-radius:16px 0 16px 0;display:inline-flex;gap:6px;align-items:center}
.mmt-toast{background:var(--toast);color:#fff;border-radius:10px;padding:11px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--e3)}
.mmt-toast em{font-style:normal;color:var(--orange)}
.mmt-toast button{margin-left:auto;border:0;background:none;color:#fff;font-weight:700;font-size:13px}
.alertcard{background:linear-gradient(135deg,#E9F8F8,#F4FBFF);border-radius:14px;padding:12px 14px;display:grid;gap:10px;border:1px solid #DDF1F1}
.alertcard .r{display:flex;gap:10px;align-items:center;font-size:13.5px}
.alertcard hr{border:0;border-top:1px solid #D7ECEC;margin:0}
.search{background:#fff;border:1.5px solid #D6E8FA;border-radius:999px;padding:9px 8px 9px 14px;display:flex;align-items:center;gap:10px;color:#7D8792;font-size:13px;box-shadow:0 2px 8px rgba(0,140,255,.07)}
.dest{border-radius:16px;overflow:hidden;position:relative;height:178px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
.dest .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.65))}
.dest>*:not(.shade):not(.art){position:relative}
.dest .art{position:absolute;inset:0}
.dest b{font-size:15px;font-weight:900}
.dest small{font-size:11.5px;opacity:.9}
.dest .pin{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);font-size:11px;padding:3px 8px;border-radius:999px;display:flex;gap:3px;align-items:center}
.mmt-nav{background:#fff;display:grid;grid-template-columns:repeat(4,1fr) 66px;align-items:end;padding:8px 6px 12px;box-shadow:0 -1px 0 #EAEAEA}
.mmt-nav span{display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--ink-2);position:relative}
.mmt-nav span.on{color:var(--blue);font-weight:700}
.mmt-nav .badge{position:absolute;top:-6px;left:54%}
.mmt-nav .fab{justify-self:center;margin-top:-26px}

/* ---------- Agent cards (light) ---------- */
.agc{position:relative;background:var(--ag-card);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 6px 18px rgba(47,111,214,.10)}
.agc::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1.2px;background:var(--ag-edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.agc .hd{display:flex;gap:10px;align-items:center}
.agc .hd .tx{flex:1;display:grid;line-height:1.25}
.agc .hd .tx small{font-size:11px;color:#5B6B85;font-weight:700;letter-spacing:.02em}
.agc .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.agc .x{border:0;background:none;color:#7A8699;padding:2px}
.ag-chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed #8DBEF0;background:#fff;color:#0B4A8F;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
.ag-chip.ok{border-style:solid;border-color:var(--blue);color:var(--blue)}
.ag-chip.priv{border-color:#B9B0E6;color:var(--ag-private);background:var(--ag-private-tint)}
.quote{display:block;font-size:12px;color:var(--ink-2);border-left:2px solid var(--blue-line);padding-left:8px;font-style:italic}
.private{background:var(--ag-private-tint);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.private .lk{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:900;color:var(--ag-private);text-transform:uppercase;letter-spacing:.05em}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{border:1px solid #D6E3F5;background:#fff;border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:2px;min-width:150px;font-size:12.5px;font-weight:700;transition:transform .12s,border-color .15s}
.sugg button small{font-weight:400;color:var(--ink-2);font-size:11.5px}
.sugg button:hover{border-color:var(--blue)}
.sugg button:active{transform:scale(.97)}
.steps{display:grid;gap:9px}
.step{display:flex;gap:10px;align-items:center;font-size:13px}
.step .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.step.done .ic{background:var(--ok)}
.step.now .ic{border:2px solid var(--blue);border-right-color:transparent;animation:rot .9s linear infinite}
.step.wait{color:var(--ink-3)} .step.wait .ic{border:2px solid #D7DBE0}
.ring{position:relative;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-weight:900}

/* Agent cards (dark, over WhatsApp) */
.agd{position:relative;background:var(--ag-dark);color:#fff;border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);backdrop-filter:blur(12px)}
.agd::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(135deg,rgba(126,182,255,.55),rgba(126,182,255,.08));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.agd .hd{display:flex;gap:10px;align-items:center}
.agd .hd .tx{flex:1;display:grid;line-height:1.25}
.agd .hd .tx small{font-size:11px;color:#9FB6D6;font-weight:700}
.agd p{font-size:13px;color:#D3DEEE;line-height:18px}
.agd .btn-ghost{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700}
.agd .btn-light{border:0;background:#fff;color:#0B2A5B;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:900}
.dchip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.08);color:#DCE7F7;border:1px solid rgba(255,255,255,.12)}
.dchip.priv{background:rgba(155,140,255,.16);color:#CFC7FF;border-color:rgba(185,176,255,.3)}
.dchip.firm{background:rgba(255,169,77,.14);color:#FFC892;border-color:rgba(255,169,77,.3)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#FFB4B4}
.live i{width:7px;height:7px;border-radius:50%;background:#FF5A5A;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- Notifications ---------- */
.lock{background:linear-gradient(170deg,#28466F 0%,#1B2E4C 45%,#0E1726 100%);border-radius:20px;padding:16px 12px;display:grid;gap:8px}
.lock .time{color:#fff;text-align:center;font-size:40px;font-weight:300;letter-spacing:.02em;margin-bottom:4px}
.push{background:rgba(245,247,250,.86);backdrop-filter:blur(14px);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.push .app{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;grid-row:span 2;margin-top:1px}
.push .top{display:flex;justify-content:space-between;font-size:11px;color:#58606B}
.push .top b{color:#111;font-size:13px}
.push p{font-size:12.5px;color:#222;line-height:17px;grid-column:2}
.push .acts{grid-column:2;display:flex;gap:6px;margin-top:4px}
.push .acts button{border:0;background:rgba(0,0,0,.07);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:700;color:#111}
.push .acts button.pri{background:var(--blue);color:#fff}
.banner{border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;position:relative;overflow:hidden}
.banner .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.banner .tx{display:grid;line-height:1.3}
.banner .tx b{font-size:13.5px}
.banner .tx span{font-size:12px;color:var(--ink-2)}
.banner.nudge{background:var(--ag-card);border:1px solid #D3E2FA}
.banner.remind{background:var(--remind-bg);border:1px solid #D2EFEC} .banner.remind .ic{background:var(--remind)}
.banner.urgent{background:var(--urgent-bg);border:1px solid #FBD9C4} .banner.urgent .ic{background:var(--urgent)}
.banner.ok{background:var(--ok-bg);border:1px solid #CDEBD9} .banner.ok .ic{background:var(--ok)}
.banner.error{background:var(--error-bg);border:1px solid #F6CDD2} .banner.error .ic{background:var(--error)}
.banner .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--urgent);transition:width 1s linear}
.count{font-weight:900;color:var(--urgent);font-size:15px}

/* ---------- Sheets ---------- */
.mini{width:340px;max-width:100%;height:560px;border-radius:26px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.12);flex:none}
.mini .dim{position:absolute;inset:0;background:rgba(12,27,51,.45)}
.mini .ghost{padding:14px;display:grid;gap:10px}
.mini .ghost i{display:block;height:64px;border-radius:14px;background:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--e3);display:grid;gap:12px;padding:8px 16px 18px;animation:up .35s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#D6D6D6;justify-self:center}
.sheet .hd{display:flex;gap:10px;align-items:center}
.sheet .hd b{flex:1;font-size:16px;font-weight:900}
.sheet.ag{background:linear-gradient(180deg,#F4F8FF 0%,#FFFFFF 38%)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.li .ms{color:var(--ok)}

/* ---------- Decisions & polls ---------- */
.dec{background:#fff;border-radius:18px;box-shadow:var(--e2);padding:14px;display:grid;gap:12px;border:1px solid #E7ECF3}
.dec .q{display:grid;gap:3px}
.dec .q b{font-size:15px;font-weight:900}
.dec .opt{border:1.5px solid #E2E7EE;border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;transition:border-color .2s,background .2s}
.dec .opt.def{border-color:var(--blue);background:var(--blue-wash)}
.dec .opt .th{width:42px;height:42px;border-radius:10px}
.dec .reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.react{border:1.5px solid #E2E7EE;background:#fff;border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--ink-2);transition:all .18s}
.react .ms{font-size:22px}
.react.on.love{border-color:#2F6FD6;background:#EEF4FF;color:#2F6FD6}
.react.on.fine{border-color:var(--teal);background:var(--teal-tint);color:var(--teal)}
.react.on.no{border-color:var(--urgent);background:#FFF2EA;color:var(--urgent)}
.react.pop{animation:popk .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popk{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.why{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:6px;font-size:12.5px}
.why .r{display:flex;gap:8px;align-items:flex-start}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900;flex:none;box-shadow:0 0 0 2px #fff}
.avs .av{margin-right:-6px}
.av.lg{width:36px;height:36px;font-size:13px}
.av.dim{opacity:.35}
.poll .row{display:grid;gap:4px}
.poll .row .l{display:flex;justify-content:space-between;font-size:13px}
.poll .tr{height:8px;border-radius:4px;background:#EEF0F3;overflow:hidden}
.poll .tr i{display:block;height:100%;border-radius:4px;background:var(--cta);transition:width .5s cubic-bezier(.2,.9,.3,1)}
.deadline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.deadline b{color:var(--urgent)}

/* ---------- Map ---------- */
.mapwrap{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--e2)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer;transition:transform .2s}
.place{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:16px;box-shadow:var(--e3);padding:10px;display:grid;grid-template-columns:72px 1fr;gap:10px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.place .ph{height:72px;border-radius:12px}
.place .tx{display:grid;gap:3px;align-content:start}
.place .acts{display:flex;gap:6px;margin-top:2px}
.place .acts button{border:1px solid #E1E5EA;background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:3px;align-items:center}
.daytabs{display:flex;gap:6px;position:absolute;top:12px;left:12px;right:12px;overflow-x:auto;scrollbar-width:none}
.daytabs button{border:0;background:rgba(255,255,255,.95);box-shadow:var(--e1);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.daytabs button i{width:8px;height:8px;border-radius:50%}
.daytabs button.on{background:var(--ag-ink);color:#fff}

/* ---------- Option & bundle cards ---------- */
.opt-card{border-radius:18px;overflow:hidden;background:#fff;box-shadow:var(--e2);display:grid}
.opt-card .top{background:linear-gradient(135deg,#0E2A57 0%,#1B4F9C 60%,#3D8EF7 100%);color:#fff;padding:14px;display:flex;gap:12px;align-items:center}
.opt-card .top .tx{flex:1;display:grid;gap:2px}
.opt-card .top small{color:#BFD6F5;font-size:11.5px}
.opt-card .body{padding:12px 14px 14px;display:grid;gap:10px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.met{background:var(--surface-2);border-radius:10px;padding:7px 9px;display:grid}
.met b{font-size:14px;font-weight:900}
.met span{font-size:10.5px;color:var(--ink-2)}
.tr-line{display:flex;gap:6px;font-size:12px;align-items:flex-start}
.tr-line.p{color:var(--ok)} .tr-line.n{color:var(--error)}
.bundle{background:#fff;border-radius:16px;box-shadow:var(--e1);padding:12px 14px;display:grid;gap:8px}
.bundle .hd{display:flex;gap:10px;align-items:center}
.bundle .hd .tx{flex:1;display:grid;line-height:1.25}
.bundle .items{display:grid;gap:4px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--divider);padding-top:8px}
.bundle .items div{display:flex;justify-content:space-between;align-items:center}
.hold{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#C25A00;background:#FFF4E8;border-radius:10px;padding:7px 10px}

/* ---------- States ---------- */
.state{background:#fff;border-radius:16px;box-shadow:var(--e1);padding:16px;display:grid;gap:10px;justify-items:center;text-align:center;align-content:start}
.state .t{font-size:15px;font-weight:900}
.agentbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;transition:all .3s}
.agentbar.on{background:var(--ag-card);border:1px solid #D3E2FA}
.agentbar.off{background:#F1F2F4;border:1px solid #E3E5E8}
.agentbar.off .mo{filter:grayscale(1) brightness(1.6);opacity:.55}
.agentbar .tx{flex:1;display:grid;line-height:1.3}
.agentbar .tx span{font-size:12px;color:var(--ink-2)}
.skel{background:linear-gradient(90deg,#ECEEF1 25%,#F7F8FA 50%,#ECEEF1 75%);background-size:200% 100%;animation:sh 1.3s infinite linear;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Micro-interactions ---------- */
.mi{background:#fff;border:1px solid #E1E3E7;border-radius:16px;padding:16px;display:grid;gap:12px;align-content:start}
.mi .stage{background:var(--bg);border-radius:12px;min-height:120px;display:grid;place-items:center;padding:14px;position:relative;overflow:hidden}
.mi .hd{display:flex;justify-content:space-between;align-items:center}
.mi .hd b{font-size:13.5px}
.typing{display:inline-flex;gap:4px;padding:10px 12px;background:#fff;border-radius:4px 14px 14px 14px;border:1px solid #E3E9F2}
.typing i{width:6px;height:6px;border-radius:50%;background:#8DA2C0;animation:typ 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.roll{display:inline-block;overflow:hidden;height:26px;vertical-align:bottom}
.roll span{display:block;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.checkdraw path{stroke-dasharray:40;stroke-dashoffset:40}
.checkdraw.go path{animation:dash .55s .1s ease-out forwards}
.checkdraw.go circle{animation:pulse .6s ease-out}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.slide-in{animation:slidein .4s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{transform:translateY(16px);opacity:0}}

/* ---------- Phones ---------- */
.phones{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.phonewrap{display:grid;gap:10px;width:344px}
.phone{width:344px;height:744px;border-radius:44px;background:#0E0F12;padding:9px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:var(--bg);display:flex;flex-direction:column}
.sbar{height:40px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:14px;font-weight:700}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar.dark{color:#fff}
.scroll{flex:1;overflow:hidden;padding:0 12px;display:grid;gap:10px;align-content:start}
.capt b{font-size:14px}
.capt span{display:block;font-size:12.5px;color:var(--ink-2)}
/* WhatsApp chat */
.wa{background:var(--wa-bg);color:#E9EDEF}
.wa .head{background:var(--wa-head);display:flex;align-items:center;gap:8px;padding:6px 12px 10px;flex:none}
.wa .head .back{display:flex;align-items:center;gap:0;font-size:16px;background:rgba(255,255,255,.08);border-radius:999px;padding:6px 10px 6px 4px}
.wa .head .gi{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#C99A6B,#7A5232);display:grid;place-items:center;font-size:16px}
.wa .head .tt{flex:1;display:grid;line-height:1.2;min-width:0}
.wa .head .tt b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa .head .tt span{font-size:11.5px;color:var(--wa-meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa .head .vid{background:rgba(255,255,255,.08);border-radius:999px;padding:7px 10px;display:flex;gap:2px;align-items:center}

.wm{display:flex;gap:6px;align-items:flex-end;max-width:84%}
.wm .pa{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff}
.wb{background:var(--wa-in);border-radius:14px;padding:6px 9px 4px;font-size:14.5px;line-height:19px;min-width:60px}
.wb b{display:block;font-size:13px;margin-bottom:1px}
.wb .meta{float:right;font-size:10.5px;color:var(--wa-meta);margin:6px 0 0 10px;display:inline-flex;gap:2px;align-items:center}
.wm.me{align-self:flex-end}
.wm.me .wb{background:var(--wa-out)}
.wm.me .meta{color:#9FC3B5}
.wb .rep{background:rgba(0,0,0,.22);border-left:3px solid #21C063;border-radius:6px;padding:4px 8px;font-size:12px;margin:2px 0 4px;color:#C9D1D5}
.wb .rep b{color:#21C063;font-size:12px}
.wsys{align-self:center;background:#1E1E1E;color:#BFC5C9;font-size:11.5px;padding:4px 10px;border-radius:8px;margin:4px 0}
.wa .inbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 22px;background:var(--wa-head)}
.wa .inbar .box{flex:1;background:var(--wa-input);border-radius:999px;padding:7px 8px 7px 14px;display:flex;align-items:center;gap:8px;color:#8D8D8D;font-size:14px}
.wa .inbar .mic{width:36px;height:36px;border-radius:50%;background:var(--wa-green);display:grid;place-items:center;color:#0B0B0B}
.wa .tip{position:absolute;right:12px;left:12px;bottom:78px;z-index:5}
.wa .readbar{position:absolute;left:10px;right:10px;top:94px;z-index:5;background:var(--ag-dark);border:1px solid var(--ag-dark-line);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;color:#fff;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.wa .readbar button{margin-left:auto;border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700}
.hl{box-shadow:0 0 0 1.5px rgba(92,182,255,.85)}
/* WhatsApp call */
.wac{background:var(--wac-bg);color:#E9EDEF}
.wac .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 10px}
.wac .tile{background:var(--wac-tile);border-radius:14px;height:118px;padding:10px 12px;display:grid;align-content:space-between;border:1.5px solid transparent;transition:border-color .25s}
.wac .tile b{font-size:17px;font-weight:700}
.wac .tile .r{display:flex;align-items:center;gap:8px}
.wac .tile .av{width:38px;height:38px;font-size:14px;box-shadow:none}
.wac .tile .dots{flex:1;height:2px;background:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 7px);opacity:.55}
.wave{flex:1;display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;flex:none;height:6px;border-radius:2px;background:currentColor;animation:eq .7s ease-in-out infinite alternate}

.wac .ctrl{flex:none;display:flex;justify-content:space-around;align-items:center;padding:12px 30px 26px;background:var(--wac-tile);border-radius:22px 22px 0 0}
.wac .ctrl>span{width:46px;height:46px;border-radius:50%;background:#2B3B44;display:grid;place-items:center}
.wac .ctrl>span.end{background:var(--wac-end)}
.wac .toastw{background:var(--wac-toast);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;margin:0 10px;box-shadow:0 8px 20px rgba(0,0,0,.35)}




/* ---------- Google-Maps-style map (light + dark) ---------- */
.maps-row{display:grid;grid-template-columns:360px 360px minmax(0,1fr);gap:20px;align-items:start}
.mapcol{display:grid;gap:8px}
.gm{--land:#F5F3EE;--card:#FFFFFF;--ink:#1F2328;--sub:#5F6670;--chip:#FFFFFF;--line:#E7E7E7;--ctl:#FFFFFF;--ctlInk:#3C4043;
  position:relative;width:360px;height:700px;border-radius:32px;overflow:hidden;background:var(--land);box-shadow:0 18px 44px rgba(16,30,60,.16);font-family:var(--font);isolation:isolate}
.gm.dark{--land:#1D2127;--card:#22272F;--ink:#ECEFF3;--sub:#9AA3AE;--chip:#2A3039;--line:#353C46;--ctl:#2A3039;--ctlInk:#D8DEE6}
.gm .base{position:absolute;inset:0;z-index:0}
.gm .base svg{display:block;width:100%;height:100%}
.gm .pins{position:absolute;inset:0;z-index:2}
/* top overlays */
.gm .top{position:absolute;left:12px;right:12px;top:14px;z-index:5;display:grid;gap:10px}
.gm .srch{display:flex;gap:8px;align-items:center}
.gm .srch .bar{flex:1;height:46px;background:var(--chip);border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;color:var(--sub);font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08)}
.gm .srch .bar .me{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#1D4FD8;color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center}
.gm .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.gm .chips::-webkit-scrollbar{display:none}
.gm .chips button{flex:none;border:0;height:34px;border-radius:999px;padding:0 13px;background:var(--chip);color:var(--ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.gm .chips button .ms{font-size:18px}
.gm .chips button.on{background:#0C1B33;color:#fff}
.gm.dark .chips button.on{background:#CFE3FF;color:#0C1B33}
.gm .chips button i{width:9px;height:9px;border-radius:50%}
.gm .wx{position:absolute;right:12px;top:112px;z-index:5;display:grid;gap:8px;justify-items:end}
.gm .wx span{background:var(--chip);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:700;display:inline-flex;gap:5px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.14)}
/* right controls */
.gm .ctl{position:absolute;right:12px;bottom:200px;z-index:5;display:grid;gap:10px}
.gm .ctl .grp{background:var(--ctl);border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.16);display:grid;overflow:hidden}
.gm .ctl .grp span{width:42px;height:42px;display:grid;place-items:center;color:var(--ctlInk)}
.gm .ctl .grp span+span{border-top:1px solid var(--line)}
.gm .ctl .loc{width:46px;height:46px;border-radius:50%;background:var(--ctl);box-shadow:0 2px 8px rgba(0,0,0,.16);display:grid;place-items:center;color:#1A73E8}
/* pins */
.gpin{position:absolute;transform:translate(-50%,-100%);border:0;padding:0;background:none;cursor:pointer;z-index:2;transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.gpin:hover{transform:translate(-50%,-100%) scale(1.06)}
.gpin.photo .fr{width:40px;height:40px;border-radius:12px;padding:2.5px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.28);position:relative;display:block}
.gpin.photo .fr span.im{display:block;width:100%;height:100%;border-radius:9.5px;overflow:hidden}
.gpin.photo .fr::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px;z-index:-1}
.gpin.photo .n{position:absolute;left:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.gpin.photo.sel{z-index:6;transform:translate(-50%,-100%) scale(1.25)}
.gpin.photo.sel .fr{background:var(--c);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.gpin.photo.sel .fr::after{background:var(--c)}
.gpin.photo.sel .fr::before{content:"";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--c);opacity:.35}
.gpin.icon .dot{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25);color:var(--c);position:relative}
.gpin.icon .dot::after{content:"";position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:#fff;transform:translateX(-50%) rotate(45deg);z-index:-1}
.gpin.icon .n{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-size:9.5px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.gpin.stay{transform:translate(-50%,-100%)}
.gpin.stay .tear{width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#3D8EF7,#0A5BC4);display:grid;place-items:center;box-shadow:0 6px 14px rgba(10,91,196,.4);border:3px solid #fff}
.gpin.stay .tear .ms{transform:rotate(45deg);color:#fff;font-size:20px}
.gpin.stay .price{position:absolute;left:30px;top:0;background:#fff;color:#0C1B33;font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.22);white-space:nowrap}
.gpin.stay .ring{position:absolute;left:50%;bottom:-6px;width:12px;height:12px;border-radius:50%;background:#1A73E8;border:2.5px solid #fff;transform:translateX(-50%);box-shadow:0 0 0 6px rgba(26,115,232,.18)}
.gpin.cluster{transform:translate(-50%,-50%)}
.gpin.cluster .c{width:38px;height:38px;border-radius:50%;background:#0C1B33;color:#fff;font-size:12.5px;font-weight:900;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.gm.dark .gpin.photo .fr,.gm.dark .gpin.icon .dot,.gm.dark .gpin.icon .dot::after,.gm.dark .gpin.photo .fr::after{background:#2A3039}
.gm.dark .gpin.icon .n,.gm.dark .gpin.photo .n{box-shadow:0 0 0 2px #2A3039}
/* callout */
.callout{position:absolute;z-index:7;transform:translate(-50%,calc(-100% - 62px));background:var(--card);color:var(--ink);border-radius:16px;padding:8px 10px 8px 8px;display:flex;gap:9px;align-items:center;box-shadow:0 10px 26px rgba(0,0,0,.28);white-space:nowrap;animation:pinpop .28s cubic-bezier(.2,1.3,.4,1)}
.callout::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--card);transform:translateX(-50%) rotate(45deg)}
.callout .th{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none}
.callout b{font-size:13.5px;display:block}
.callout small{font-size:11.5px;color:var(--sub);display:flex;gap:4px;align-items:center}
.callout small .st{color:#E9A23B;font-size:14px}
.callout a{width:30px;height:30px;border-radius:50%;background:#1A73E8;color:#fff;display:grid;place-items:center;text-decoration:none;flex:none}
.callout.al-l{transform:translate(-30px,calc(-100% - 62px))}
.callout.al-l::after{left:30px}
.callout.al-r{transform:translate(calc(-100% + 30px),calc(-100% - 62px))}
.callout.al-r::after{left:auto;right:24px;transform:rotate(45deg)}
@keyframes pinpop{from{opacity:0;margin-top:8px}}
/* bottom sheet + carousel */
.gm .sheet2{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);padding:8px 0 16px;display:grid;gap:10px}
.gm .sheet2 .grab{width:38px;height:4px;border-radius:2px;background:var(--line);justify-self:center}
.gm .sheet2 .hd{display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--ink)}
.gm .sheet2 .hd .tx{flex:1;display:grid;line-height:1.25}
.gm .sheet2 .hd b{font-size:16px;font-weight:900}
.gm .sheet2 .hd span{font-size:12px;color:var(--sub)}
.gm .sheet2 .hd a{font-size:12.5px;font-weight:900;color:#1A73E8;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.gm.dark .sheet2 .hd a,.gm.dark .pc a.dir{color:#8AB4F8}
.gm .car{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.gm .car::-webkit-scrollbar{display:none}
.pc{flex:none;width:250px;grid-template-columns:78px 1fr;border-radius:18px;background:var(--card);border:1px solid var(--line);overflow:hidden;scroll-snap-align:start;display:grid;color:var(--ink);text-decoration:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.pc.sel{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c)}
.pc .im{height:auto;min-height:92px;position:relative}
.pc .im .n{position:absolute;left:6px;top:6px;background:var(--c);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px}
.pc .im .who{display:none;position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px}
.pc .bd{padding:8px 10px;display:grid;gap:2px;align-content:center}
.pc .bd b{font-size:13.5px}
.pc .bd .m{font-size:11.5px;color:var(--sub);display:flex;gap:4px;align-items:center}
.pc .bd .m .st{color:#E9A23B;font-size:14px}
.pc .bd .links{display:flex;gap:6px;margin-top:4px}
.pc .bd .links a{flex:1;text-decoration:none;font-size:11.5px;font-weight:900;border-radius:999px;padding:6px 0;display:inline-flex;justify-content:center;align-items:center;gap:3px}
.pc .bd .links a.dir{background:#1A73E8;color:#fff}
.gm.dark .pc .bd .links a.dir{background:#8AB4F8;color:#0C1B33}
.pc .bd .links a.view{border:1px solid var(--line);color:var(--ink)}
/* kit */
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kit .k:last-child{grid-column:1 / -1}
.kit .k .callout{white-space:nowrap}
.kit .k{background:#F3F1EC;border-radius:14px;height:110px;position:relative;display:grid;place-items:end center;padding-bottom:8px;font-size:11.5px;color:var(--ink-2);font-weight:700}
.kit .k .gpin{left:50%;top:62%}
.kit .k .gpin.cluster{top:46%}
@media (max-width:1240px){ .maps-row{grid-template-columns:repeat(2,360px)} .maps-row .board{grid-column:1 / -1} }
@media (max-width:820px){ .maps-row{grid-template-columns:1fr;justify-items:center} }

.art{display:block;width:100%;height:100%}
.art svg{display:block;width:100%;height:100%}


/* Logos and photos */
[data-img]{background-size:cover;background-position:center;background-repeat:no-repeat}
.logo-sq[data-img]{background-color:#eee;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.push .app.mmt{position:relative;overflow:visible;border-radius:7px}

.push .app .bdg .ms{font-size:11px;color:#fff}

.canvas.logos{gap:22px;align-items:flex-start}

/* Mobile: one phone at a time */
.mtabs{display:none}
@media (max-width:1180px){
  .stage{grid-template-columns:auto auto;}
  .note{grid-column:1 / -1;position:static;max-width:750px;margin:0 auto;width:100%}
}
@media (max-width:820px){

  .stage{grid-template-columns:1fr;padding:12px 8px 30px;gap:14px}

}

<script>
/* ======================= SHAPES (viewBox 0 0 100 100, all one continuous line) ======================= */
const N = 220, BOX = 44;           /* every shape fits a 44-unit box in the centre: generous padding inside the orb */
const PATHS = {
  my:"M14,56 C18,48 22,38 27,37 C31,36 31,44 29,52 L28,57 C31,46 35,37 40,37 C45,37 44,45 42,52 L41,57 C44,47 49,37 54,37 C59,37 58,45 56,52 C55,56 57,58 60,56 C63,52 65,44 66,38 C67,48 66,56 71,56 C76,56 79,46 81,37 C80,50 78,64 74,72 C70,80 63,80 64,74 C65,69 75,66 86,62",
  plane:"M19,55 L82,28 L48,58 L19,55 L48,58 L60,77 L82,28",
  pin:"M50,51 C46,51 43,48 43,44 C43,40 46,37 50,37 C54,37 57,40 57,44 C57,48 54,51 50,51 L50,84 C42,73 28,62 28,45 C28,31 38,21 50,21 C62,21 72,31 72,45 C72,62 58,73 50,84",
  figure:"M50,57 C44,66 36,78 30,78 C24,78 25,70 33,66 C39,63 45,61 50,61 C55,61 61,63 67,66 C75,70 76,78 70,78 C64,78 56,66 50,57 L45,49 C40,43 30,46 30,41 C30,36 39,35 44,41 L50,46 C46,42 44,37 46,33 C48,29 52,29 54,33 C56,37 54,42 50,46 L56,41 C61,35 70,36 70,41 C70,46 60,43 55,49 L50,57",
  route:"M16,78 C30,78 30,60 44,60 C58,60 56,42 70,42 C80,42 84,34 84,22",
  lock:"M37,50 L37,40 C37,31 42,25 50,25 C58,25 63,31 63,40 L63,50 L74,50 L74,79 L26,79 L26,50 L58,50 Q50,50 50,57 C46,57 46,64 50,64 C54,64 54,57 50,57 L50,71",
  check:"M24,52 L42,70 L78,32",
  knot:"M12,60 C28,60 34,38 46,42 C58,46 40,66 52,66 C64,66 62,42 50,48 C42,53 60,62 88,56"
};

const sp = document.getElementById("moSp");
const CACHE = {};
function fit(pts, box=BOX){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});
  const k=box/Math.max(x1-x0,y1-y0), cx=(x0+x1)/2, cy=(y0+y1)/2;
  return pts.map(([x,y])=>[50+(x-cx)*k,50+(y-cy)*k]);
}
function sample(name){
  if(CACHE[name]) return CACHE[name];
  sp.setAttribute("d",PATHS[name]); const L=sp.getTotalLength(); const pts=[];
  for(let i=0;i<N;i++){ const p=sp.getPointAtLength(L*i/(N-1)); pts.push([p.x,p.y]); }
  return CACHE[name]=fit(pts, name==="check"?36:BOX);
}
/* closed line with three loops (trefoil), and a route whose stops are small loops */
function trefoil(rot){ const pts=[]; for(let i=0;i<N;i++){ const t=2*Math.PI*i/(N-1); let x=Math.sin(t)+2*Math.sin(2*t), y=Math.cos(t)-2*Math.cos(2*t);
  const c=Math.cos(rot), s=Math.sin(rot); pts.push([x*c-y*s, x*s+y*c]); } return fit(pts,BOX); }
const TREF = trefoil(0);
const READY = (()=>{ const pts=[]; const B=(s)=>{ const p0=[16,76],p1=[40,80],p2=[56,30],p3=[84,26]; const u=1-s; return [u*u*u*p0[0]+3*u*u*s*p1[0]+3*u*s*s*p2[0]+s*s*s*p3[0], u*u*u*p0[1]+3*u*u*s*p1[1]+3*u*s*s*p2[1]+s*s*s*p3[1]]; };
  const stops=[.33,.66,.95], w=.14, r=8;
  for(let i=0;i<N;i++){ const s=i/(N-1); let [x,y]=B(s); stops.forEach(c=>{ const u=(s-(c-w/2))/w; if(u>0&&u<1){ const a=2*Math.PI*u; x+= r*Math.sin(a); y+= -r*(1-Math.cos(a)); } }); pts.push([x,y]); }
  return fit(pts,BOX); })();

const G = {
  wave(t){ const pts=[]; for(let i=0;i<N;i++){ const u=i/(N-1), x=28+44*u; const env=Math.sin(Math.PI*u)**1.3;
    const amp=11*env*(.35+.65*Math.abs(Math.sin(t*2.2+u*5))*(.6+.4*Math.sin(t*1.2+u*11)));
    pts.push([x,50+amp*Math.sin(u*Math.PI*7+t*4.6)]);} return pts; },
  refresh(t){ const pts=[], r=18, rot=t*1.5, arcN=Math.round(N*.84); for(let i=0;i<arcN;i++){ const a=rot+2*Math.PI*.83*i/(arcN-1); pts.push([50+r*Math.cos(a),50+r*Math.sin(a)]); }
    const a=rot+2*Math.PI*.83, tip=[50+r*Math.cos(a),50+r*Math.sin(a)], tan=a+Math.PI/2;
    const h1=[tip[0]-8*Math.cos(tan-0.6),tip[1]-8*Math.sin(tan-0.6)], h2=[tip[0]-8*Math.cos(tan+0.6),tip[1]-8*Math.sin(tan+0.6)];
    const rest=N-arcN, seg=[[tip,h1],[h1,tip],[tip,h2]]; for(let i=0;i<rest;i++){ const f=i/(rest-1)*3, k=Math.min(2,Math.floor(f)), ff=f-k; const q=seg[k]; pts.push([q[0][0]+(q[1][0]-q[0][0])*ff,q[0][1]+(q[1][1]-q[0][1])*ff]); } return pts; },
  clock(t){ const pts=[], r=20, cN=Math.round(N*.78); for(let i=0;i<cN;i++){ const a=-Math.PI/2+2*Math.PI*i/(cN-1); pts.push([50+r*Math.cos(a),50+r*Math.sin(a)]); }
    const ha=-Math.PI/2+t*1.1, hand=[[50,30],[50,50],[50+12*Math.cos(ha),50+12*Math.sin(ha)]]; const rest=N-cN;
    for(let i=0;i<rest;i++){ const f=i/(rest-1)*2, k=Math.min(1,Math.floor(f)), ff=f-k; const a=hand[k],b=hand[k+1]; pts.push([a[0]+(b[0]-a[0])*ff,a[1]+(b[1]-a[1])*ff]); } return pts; },
  trefoil(t){ return trefoil(t*.25); }
};

/* ======================= STATES ======================= */
/* glow: v1/v2 = rotation speed of the two glow layers (deg/s), pulse = zoom amount, per = zoom period (s), o2 = second layer opacity */
const STATES = {
  idle:{name:"Idle",what:"Docked",text:"The line sketches “my”, rubs it out from the start, then sketches a plane, then a pin, and loops.",where:"MMT bottom bar · over other apps",seq:["my","plane","pin"],hold:1100,
    glow:{v1:40,v2:-26,pulse:0,per:4,o2:1},glowText:"Two glows drift in opposite directions, as in the app today."},
  hello:{name:"Hello",what:"Introducing itself",text:"A plane is sketched, shrinks as it flies out to the edge, loops once around the orb, lands back in the centre at full size, then is rubbed out and “my” is written.",where:"First time the agent opens · permission screens",seq:["plane","my"],fly:true,hold:900,
    glow:{v1:40,v2:-26,pulse:0,per:4,o2:1},glowText:"Same drift as idle, so the flight is the focus."},
  listening:{name:"Listening",what:"On the call",text:"The line is drawn as a live voice wave that rises and falls with whoever is speaking.",where:"Group call · live analysis",gen:"wave",
    glow:{v1:72,v2:-45,pulse:0,per:4,o2:1},glowText:"Glows drift faster, like an active conversation."},
  analysing:{name:"Analysing",what:"Making sense of it",text:"A closed line with three loops is drawn in one continuous stroke and rubbed out the moment it closes, again and again.",where:"Reading the chat · picking up needs",gen:"trefoil",cycle:true,hold:60,
    glow:{v1:0,v2:0,pulse:.14,per:4.2,o2:1},glowText:"Rotation pauses. The glow slowly zooms in and out, like breathing."},
  editing:{name:"Re-planning",what:"After a change",text:"The line is drawn as a loop arrow that keeps turning while the agent reworks the plan.",where:"Swaps, removals, group votes",gen:"refresh",
    glow:{v1:110,v2:75,pulse:0,per:4,o2:1},glowText:"Both glows turn the same way as the arrow, faster."},
  waiting:{name:"Waiting",what:"On friends",text:"A clock face is sketched, then its hand sweeps while friends reply or pay.",where:"Private checks · payment tracker",gen:"clock",
    glow:{v1:26,v2:0,pulse:0,per:4,o2:.35},glowText:"One slow glow sweeps around like a second hand. The other dims."},
  booked:{name:"Booked",what:"Celebration",text:"A check mark is sketched in one stroke, then confetti bursts out of it while the glow spins up and flashes.",where:"Trip confirmed · everyone paid · votes agreed",seq:["check"],party:true,hold:2300,
    glow:{v1:150,v2:-120,pulse:.05,per:1.1,o2:1},glowText:"Glows spin up and flash with each burst, then settle."}
};

/* ======================= ORB ENGINE ======================= */
const ease=t=>-(Math.cos(Math.PI*t)-1)/2;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DRAW=1900, ERASE=1350, GAP=450, FLY=3600;
function cum(pts){ const c=[0]; for(let i=1;i<pts.length;i++) c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return c; }
function at(pts,c,d){ if(d<=0) return pts[0].slice(); const L=c[c.length-1]; if(d>=L) return pts[pts.length-1].slice();
  let lo=0,hi=c.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(c[m]<d) lo=m; else hi=m;} const f=(d-c[lo])/(c[hi]-c[lo]||1); return [pts[lo][0]+(pts[hi][0]-pts[lo][0])*f,pts[lo][1]+(pts[hi][1]-pts[lo][1])*f]; }
function sub(pts,a,b){ const c=cum(pts), L=c[c.length-1], da=a*L, db=b*L; if(db-da<.01) return [];
  const out=[at(pts,c,da)]; for(let i=0;i<pts.length;i++) if(c[i]>da&&c[i]<db) out.push(pts[i]); out.push(at(pts,c,db)); return out; }
const toStr=pts=>pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" ");

/* plane flight for Hello: out to the edge while shrinking, one loop around, back to centre at full size */
let NATIVE=null;
function fly(pts,f){
  if(NATIVE===null){ const pl=sample("plane"); let best=pl[0]; pl.forEach(p=>{ if(p[0]-p[1]>best[0]-best[1]) best=p; }); NATIVE=Math.atan2(best[1]-50,best[0]-50); }
  const R=25, smin=.36, th0=NATIVE, head=th=>th-Math.PI/2, P=th=>[50+R*Math.cos(th),50+R*Math.sin(th)];
  let cx=50,cy=50,sc=1,rot=0; const e=x=>ease(Math.max(0,Math.min(1,x)));
  if(f<.22){ const u=e(f/.22); const p=P(th0); cx=50+(p[0]-50)*u; cy=50+(p[1]-50)*u; sc=1+(smin-1)*u; rot=(head(th0)-NATIVE)*u; }
  else if(f<.78){ const u=e((f-.22)/.56); const th=th0-2*Math.PI*u; const p=P(th); cx=p[0]; cy=p[1]; sc=smin; rot=head(th)-NATIVE; }
  else { const u=e((f-.78)/.22); const p=P(th0); cx=p[0]+(50-p[0])*u; cy=p[1]+(50-p[1])*u; sc=smin+(1-smin)*u; const r0=head(th0)-NATIVE-2*Math.PI; rot=r0+(-2*Math.PI-r0)*u; }
  const c=Math.cos(rot), s=Math.sin(rot);
  return pts.map(([x,y])=>{ const dx=(x-50)*sc, dy=(y-50)*sc; return [cx+dx*c-dy*s, cy+dx*s+dy*c]; });
}

class MoOrb{
  constructor(el){
    this.el=el; this.size=parseFloat(getComputedStyle(el).getPropertyValue("--size"))||56;
    this.sw=Math.max(2.6, 2*100/this.size);
    el.innerHTML=`<span class="g g1"></span><span class="g g2"></span><span class="sheen"></span><svg viewBox="0 0 100 100" aria-hidden="true"><g class="fx"></g><polyline class="line"/></svg>`;
    this.line=el.querySelector(".line"); this.fx=el.querySelector(".fx"); this.g1=el.querySelector(".g1"); this.g2=el.querySelector(".g2"); this.sheen=el.querySelector(".sheen");
    this.line.style.strokeWidth=this.sw; el.setAttribute("role","img");
    this.a1=Math.random()*360; this.a2=Math.random()*360; this.ph=0; this.flash=0; this.parts=[]; this.last=performance.now();
    this.setState(el.dataset.state||"idle",true);
    this.gv={...this.state.glow};
    requestAnimationFrame(this.tick.bind(this));
  }
  shape(t){ const s=this.state; return s.gen?G[s.gen](t):sample(s.seq[this.i]); }
  setState(key,first){
    const go=()=>{ this.key=key; this.state=STATES[key]; this.i=0; this.el.setAttribute("aria-label","Trip agent: "+this.state.name); this.phase="gap"; this.t0=performance.now(); this.pending=null; };
    if(first||!this.phase){ go(); this.t0-=GAP; return; }
    if(this.phase==="gap"){ go(); return; }
    this.pending=go; this.eraseFrom = this.phase==="draw" ? this.head : 1;
    if(this.phase!=="erase"){ this.phase="erase"; this.t0=performance.now(); }
  }
  burst(){
    const cols=["#FFFFFF","#FFFFFF","#9FD1FF","#5AB0FF","#CFE6FF"];
    for(let i=0;i<34;i++){ const a=Math.random()*Math.PI*2, v=26+Math.random()*30;
      this.parts.push({x:50,y:46,vx:Math.cos(a)*v,vy:Math.sin(a)*v-18,r:Math.random()*360,vr:(Math.random()-.5)*540,life:0,max:1.5+Math.random()*.7,
        kind:Math.random()<.55?"bar":"dot",c:cols[i%cols.length],w:1.6+Math.random()*1.4}); }
    this.flash=1;
  }
  stepFx(dt){
    let html="";
    if(this.ring){ this.ring.t+=dt; const f=this.ring.t/1.1; if(f>=1) this.ring=null; else html+=`<circle cx="50" cy="50" r="${(14+34*ease(f)).toFixed(2)}" fill="none" stroke="#fff" stroke-width="${(1.6*(1-f)).toFixed(2)}" opacity="${(0.7*(1-f)).toFixed(2)}"/>`; }
    this.parts=this.parts.filter(p=>p.life<p.max);
    this.parts.forEach(p=>{ p.life+=dt; p.vy+=46*dt; p.vx*=.985; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; const o=Math.max(0,1-p.life/p.max);
      html+= p.kind==="bar" ? `<rect x="${(p.x-p.w).toFixed(2)}" y="${(p.y-.7).toFixed(2)}" width="${(p.w*2).toFixed(2)}" height="1.4" rx=".7" fill="${p.c}" opacity="${o.toFixed(2)}" transform="rotate(${p.r.toFixed(1)} ${p.x.toFixed(2)} ${p.y.toFixed(2)})"/>`
                           : `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="${(p.w*.55).toFixed(2)}" fill="${p.c}" opacity="${o.toFixed(2)}"/>`; });
    this.fx.innerHTML=html;
  }
  glow(dt){
    const g=this.state.glow, k=Math.min(1,dt*1.6);
    for(const key of ["v1","v2","pulse","per","o2"]) this.gv[key]+=(g[key]-this.gv[key])*k;
    if(reduce) return;
    this.a1+=this.gv.v1*dt; this.a2+=this.gv.v2*dt; this.ph+=dt*2*Math.PI/this.gv.per; this.flash*=Math.pow(.25,dt);
    const p=this.gv.pulse*Math.sin(this.ph);
    this.g1.style.transform=`rotate(${this.a1.toFixed(2)}deg) scale(${(1+p+this.flash*.22).toFixed(4)})`;
    this.g2.style.transform=`rotate(${this.a2.toFixed(2)}deg) scale(${(1-p*.8+this.flash*.12).toFixed(4)})`;
    this.g2.style.opacity=this.gv.o2.toFixed(3);
    this.sheen.style.opacity=(1-this.flash*.55).toFixed(3);
  }
  tick(now){ if(!this.el.isConnected) return;
    const dt=Math.min(.05,(now-this.last)/1000); this.last=now; const t=now/1000; const s=this.state; const el=now-this.t0;
    this.glow(dt);
    let a=0,b=1, cur=this.shape(t);
    if(reduce){ this.phase="hold"; }
    else if(this.phase==="gap"){ a=b=0; if(el>GAP){ this.phase="draw"; this.t0=now; } }
    else if(this.phase==="draw"){ const f=Math.min(1,el/DRAW); b=ease(f); this.head=b;
      if(f>=1){ this.t0=now; if(s.fly && s.seq[this.i]==="plane"){ this.phase="fly"; } else { this.phase="hold"; if(s.party) this.burst(); } } }
    else if(this.phase==="fly"){ const f=Math.min(1,el/FLY); cur=fly(cur,f); if(f>=1){ this.phase="hold"; this.t0=now; } }
    else if(this.phase==="hold"){ const loop=(!s.gen||s.cycle) && !this.pending; if(loop && el>(s.hold??1100)){ this.phase="erase"; this.t0=now; this.eraseFrom=1; } }
    else if(this.phase==="erase"){ const f=Math.min(1,el/ERASE); b=this.eraseFrom??1; a=ease(f)*b;
      if(f>=1){ if(this.pending) this.pending(); else { this.i=(this.i+1)%(s.seq?s.seq.length:1); this.phase="gap"; this.t0=now; } } }
    if(this.phase!=="gap" || a!==b){ const seg=sub(cur,a,b); this.line.setAttribute("points",seg.length?toStr(seg):""); } else this.line.setAttribute("points","");
    this.stepFx(dt);
    requestAnimationFrame(this.tick.bind(this));
  }

/* =================== ENGINE =================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const PPL={
  aryan:{n:"Aryan",c:"#1D4FD8",city:"Ahmedabad",wa:"#53BDEB"},
  meera:{n:"Meera",c:"#BE185D",city:"Mumbai",wa:"#F15C6D"},
  dev:{n:"Dev",c:"#0F766E",city:"Bengaluru",wa:"#A5B337"},
  sana:{n:"Sana",c:"#C2410C",city:"Delhi",wa:"#FFD279"},
  rohan:{n:"Rohan",c:"#7C3AED",city:"Pune",wa:"#C39BFF"},
  dhruv:{n:"Dhruv",c:"#0369A1",city:"Hyderabad",wa:"#5FD3C5"}
};
const ORDER=["aryan","meera","dev","sana","rohan","dhruv"];
const S={step:0,beat:0,mode:"chat",show:"P",timers:[],ans:{},acts:{},done:new Set()};
const STEPS=[];
function T(fn,ms){ const id=setTimeout(fn,ms); S.timers.push(id); return id; }
function clearT(){ S.timers.forEach(clearTimeout); S.timers=[]; }
const beatsOf=st=>typeof st.beats==="function"?st.beats(S.mode):st.beats;
let P,M;

function hydrate(root){
  root.querySelectorAll(".mo").forEach(el=>{ if(!el._orb) el._orb=new MoOrb(el); });
  if(typeof paintImg==="function") paintImg(root);
  if(typeof paintArt==="function") paintArt(root);
}
function setHTML(el,html){ el.innerHTML=html; hydrate(el); el.querySelectorAll(".scrolly,.body[data-end]").forEach(w=>w.scrollTop=w.scrollHeight); }
function orbState(root,state){ root.querySelectorAll(".mo").forEach(o=>o._orb&&o._orb.setState(state)); }

function go(step,beat=0){
  clearT(); const sh=$("#sidehint"); if(sh) sh.classList.remove("on"); S.step=step; S.beat=beat;
  const st=STEPS[step], b=beatsOf(st)[beat];
  if(b.p!=="keep") setHTML(P,b.p());
  if(b.m!=="keep") setHTML(M,b.m());
  const mw=b.mwho||"meera", w=$(".col.m .who"); if(w && w.dataset.k!==mw){ w.dataset.k=mw; const pp=PPL[mw]; w.innerHTML=`<span class="av" style="background:${pp.c}">${pp.n[0]}</span><div><b>${pp.n}</b><span>Friend · ${pp.city} · WhatsApp only</span></div><span class="pill fr">${mw==="meera"?"Friend":"Silent friend"}</span>`; w.classList.add("swap"); setTimeout(()=>w.classList.remove("swap"),600); }
  if(b.show) setShow(b.show);
  renderNote(st,b); renderNav();
  if(b.run) b.run();
}
function next(){ const n=beatsOf(STEPS[S.step]).length; S.done.add(S.step+":"+S.beat);
  if(S.beat<n-1) go(S.step,S.beat+1); else if(S.step<STEPS.length-1){ S.done.add(S.step); go(S.step+1,0); } }
function prev(){ if(S.beat>0) go(S.step,S.beat-1); else if(S.step>0) go(S.step-1,beatsOf(STEPS[S.step-1]).length-1); }
function setShow(w){ S.show=w; $(".stage").dataset.show=w; $$(".mtabs button").forEach(b=>b.classList.toggle("on",b.dataset.show===w)); }

function renderNav(){
  $("#stepnav").innerHTML=STEPS.map((s,i)=>`<button class="${i===S.step?"on":S.done.has(i)?"done":""}" data-step="${i}"><i>${S.done.has(i)&&i!==S.step?'<span class="ms" style="font-size:13px">check</span>':i+1}</i>${s.name}</button>`).join("");
  const on=$("#stepnav .on"); on&&on.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
}
function renderNote(st,b){
  const n=b.note||{}, beats=beatsOf(st), last=S.step===STEPS.length-1&&S.beat===beats.length-1;
  $("#note").innerHTML=`
  <div class="ncard">
    <span class="k">Step ${S.step+1} of ${STEPS.length} · ${st.name}</span>
    <h2>${n.h||""}</h2>
    <p>${n.p||""}</p>
    ${n.tags?`<div class="tags">${n.tags.map(([c,t,i])=>`<span class="ntag ${c}">${i?`<span class="ms">${i}</span>`:""}${t}</span>`).join("")}</div>`:""}
    ${st.modes?`<div class="modesw"><span class="t-cap">Where the trip talk happens</span><div class="seg"><button class="${S.mode==="chat"?"on":""}" data-mode="chat"><span class="ms s18">chat</span> Group chat</button><button class="${S.mode==="call"?"on":""}" data-mode="call"><span class="ms s18">call</span> Group call</button></div></div>`:""}
    <div class="beats">${beats.map((_,i)=>`<button class="${i===S.beat?"on":""}" data-beat="${i}" aria-label="Moment ${i+1}"></button>`).join("")}</div>
    <div class="nav2"><button class="back" data-nav="prev" ${S.step===0&&S.beat===0?"disabled":""}><span class="ms s18">arrow_back</span>Back</button><button class="btn" data-nav="next" ${last?"disabled":""}>${n.cta||"Next"}<span class="ms s18">arrow_forward</span></button></div>
    <span class="hint">Tap inside the phones, or use <kbd>←</kbd> <kbd>→</kbd></span>
  </div>`;
}

document.addEventListener("click",e=>{
  if(e.target.closest(".screen .phback, .screen .head .back, .screen .apphd button[aria-label=Back], .screen .urlbar button[aria-label=Back], .screen .urlbar button[aria-label=Close], .screen .idhd button[aria-label=Close]")){ const x=e.target.closest(".screen"); if(x&&x.querySelector(".exs")) return; return prev(); }
  const t=e.target.closest("[data-go],[data-act],[data-step],[data-beat],[data-nav],[data-mode],[data-show]"); if(!t) return;
  if(t.dataset.nav) return t.dataset.nav==="next"?next():prev();
  if(t.dataset.step!==undefined) return go(+t.dataset.step,0);
  if(t.dataset.beat!==undefined) return go(S.step,+t.dataset.beat);
  if(t.dataset.mode){ S.mode=t.dataset.mode; return go(S.step,0); }
  if(t.dataset.show) return setShow(t.dataset.show);
  if(t.dataset.act){ const f=S.acts[t.dataset.act]; return f&&f(t,e); }
  if(t.dataset.go==="next") return next();
  const [s,b]=t.dataset.go.split(","); go(+s,+b||0);
});
document.addEventListener("keydown",e=>{ if(e.target.matches("input,textarea")) return; if(e.key==="ArrowRight") next(); if(e.key==="ArrowLeft") prev(); });

STEPS[iDone].beats[0].run=()=>{ S.ans.bookedDone=true; };
function homeFinal(){
  const svc=[["flight","Flights"],["hotel","Hotels"],["cottage","Homestays"],["beach_access","Holidays"],["train","Trains"],["directions_bus","Buses"],["local_taxi","Cabs"],["currency_exchange","Forex"]];
  return `<div class="hm" style="display:flex;flex-direction:column;height:100%">${sbar("12:10",true)}
   <div class="hm-top"><span class="lg" data-img="logos/mmt-square"></span><div class="hi"><small>Good afternoon</small><b>Aryan</b></div>${ic("notifications","s22")}</div>

STEPS[iDone].beats.push({ note:{h:"Back home, trip and agent ready",p:"The flow ends on MakeMyTrip's home screen. The group trip now lives there, with a countdown, tickets, the day plan and the group, all in one card. The agent stays docked, ready to pick up what's left, like planning Day 2.",tags:[["ag","Agent docked","smart_toy"],["","Trip on home"]]},
  p:homeFinal, m:()=>STEPS[iDone].beats[0].m(), run(){ S.ans.bookedDone=true; T(()=>{ const bb=$(".hm-agent .bub",P); if(bb) bb.classList.add("gone"); },4500); } });

/* ---- tap cues: soft pulsing circle on the next thing to tap ---- */
const CUE_SKIP=/^(noop|tick|combo|pcard|mlx|closeEx|payCancel|sideBtn|slide)$/;
function usable(el){ if(el.closest(".readbar")) return false; if(el.disabled||el.closest(".used")||!el.offsetParent) return false; if(el.dataset.act&&CUE_SKIP.test(el.dataset.act)) return false; const cs=getComputedStyle(el); return cs.pointerEvents!=="none"&&cs.visibility!=="hidden"&&+cs.opacity>.3; }
function scope(root){ return root.querySelector(".sheet-l,.agsheet,.handoff,.sentnote,.exs")||root; }
function nextKey(){ const n=beatsOf(STEPS[S.step]).length; return S.beat<n-1?`${S.step},${S.beat+1}`:`${S.step+1},0`; }
function pickP(root){ const sc=scope(root); const k=nextKey(); const pri=[`[data-go="${k}"]`,`[data-go="${k.replace(/,0$/,"")}"]`,'[data-go="next"]',".foot [data-go]",".foot [data-act]",".rec[data-go],.rec[data-act]",".push[data-go],.push[data-act]","[data-go]","[data-act]"]; for(const s of pri){ const el=[...sc.querySelectorAll(s)].find(usable); if(el) return el; } return null; }
function pickM(root){ const sc=scope(root); if(sc!==root) return pickP(root); const blocks=[...sc.querySelectorAll(".biz,.wm,.wcar,.push,.lockscr .stack,.agd")].reverse(); for(const b of blocks){ const el=[...b.querySelectorAll("[data-act],[data-go]"),...(b.matches("[data-act],[data-go]")?[b]:[])].find(usable); if(el) return el; } return pickP(root); }
let cueT, cueT2;
/* pulse only at choices where just one option has a flow */
const CUES={"2,0":'#M [data-act="q1"]',"2,3":'#P .foot [data-go="next"]',"3,0":'#M [data-act="vote"][data-d="udaipur"]',"3,2":'#M [data-act="switchGoa"]',"6,0":'#M [data-act="digi"]',"7,2":'#P [data-act="cover"]'};
const ADV=/^(openAgent|goAhead|nudgeD|cover|payAllGo|hold4)$/;
function inPhoneAdvance(){ const k=nextKey(), k2=k.replace(/,0$/,""); return [...document.querySelectorAll("#P [data-go],#P [data-act],#M [data-go],#M [data-act]")].some(el=>usable(el)&&((el.dataset.go&&(el.dataset.go===k||el.dataset.go===k2||el.dataset.go==="next"))||(el.dataset.act&&ADV.test(el.dataset.act)))); }
function placeCue(){
  $$(".cue").forEach(c=>c.remove()); $$(".cuepos").forEach(e=>e.classList.remove("cuepos"));
  const sel=CUES[S.step+","+S.beat]; let el=sel?[...document.querySelectorAll(sel)].find(usable):null;
  if(el){ if(getComputedStyle(el).position==="static") el.classList.add("cuepos"); el.insertAdjacentHTML("beforeend",`<span class="cue" aria-hidden="true"></span>`); }
  const nb=$('#note [data-nav="next"]'); if(nb) nb.classList.toggle("glow",!el&&!nb.disabled&&!inPhoneAdvance());
}
function schedCue(){ clearTimeout(cueT); clearTimeout(cueT2); cueT=setTimeout(placeCue,450); cueT2=setTimeout(placeCue,1600); }
const cueObs=new MutationObserver(ms=>{ if(ms.every(m=>[...m.addedNodes,...m.removedNodes].every(n=>n.classList&&n.classList.contains("cue")))) return; schedCue(); });
setTimeout(()=>{ [P,M,document.getElementById("note")].forEach(r=>cueObs.observe(r,{childList:true,subtree:true})); schedCue(); },0);
document.addEventListener("click",()=>{ $$(".cue").forEach(c=>c.remove()); schedCue(); },true);

P=document.getElementById("P"); M=document.getElementById("M"); paintImg(document); go(0,0);
</script></body></html>
